{% extends "base_auth.html" %}
{% block content %}
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow: hidden;
        }
        
        .floating-logo {
            position: absolute;
            width: 100px;
            height: 100px;
            background-image: url('https://res.cloudinary.com/dwdnfpr8i/image/upload/v1762146543/logo-DR_MEJIA_za9ocq.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.15;
            z-index: 0;
        }
        
        .floating-logo:nth-child(1) { top: 10%; left: 5%; animation: float1 12s ease-in-out infinite; }
        .floating-logo:nth-child(2) { top: 15%; right: 8%; animation: float2 15s ease-in-out infinite; }
        .floating-logo:nth-child(3) { top: 45%; left: 3%; animation: float3 14s ease-in-out infinite; }
        .floating-logo:nth-child(4) { top: 60%; right: 5%; animation: float4 16s ease-in-out infinite; }
        .floating-logo:nth-child(5) { bottom: 15%; left: 10%; animation: float5 13s ease-in-out infinite; }
        .floating-logo:nth-child(6) { bottom: 20%; right: 12%; animation: float6 14s ease-in-out infinite; }
        .floating-logo:nth-child(7) { top: 25%; left: 15%; animation: float7 13s ease-in-out infinite; }
        .floating-logo:nth-child(8) { top: 70%; left: 20%; animation: float8 15s ease-in-out infinite; }
        .floating-logo:nth-child(9) { top: 35%; right: 15%; animation: float9 16s ease-in-out infinite; }
        .floating-logo:nth-child(10) { bottom: 35%; right: 20%; animation: float10 14s ease-in-out infinite; }
        .floating-logo:nth-child(11) { top: 5%; left: 25%; animation: float11 14s ease-in-out infinite; }
        .floating-logo:nth-child(12) { top: 50%; left: 8%; animation: float12 13s ease-in-out infinite; }
        .floating-logo:nth-child(13) { top: 80%; right: 25%; animation: float13 15s ease-in-out infinite; }
        .floating-logo:nth-child(14) { bottom: 10%; left: 30%; animation: float14 14s ease-in-out infinite; }
        .floating-logo:nth-child(15) { top: 30%; right: 3%; animation: float15 15s ease-in-out infinite; }
        .floating-logo:nth-child(16) { bottom: 40%; left: 12%; animation: float16 13s ease-in-out infinite; }
        .floating-logo:nth-child(17) { top: 55%; right: 30%; animation: float17 16s ease-in-out infinite; }
        .floating-logo:nth-child(18) { bottom: 25%; right: 8%; animation: float18 14s ease-in-out infinite; }
        
        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(50px, 60px) rotate(20deg); }
        }
        
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-60px, 50px) rotate(-25deg); }
        }
        
        @keyframes float3 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(55px, -45px) rotate(18deg); }
        }
        
        @keyframes float4 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-50px, -55px) rotate(-20deg); }
        }
        
        @keyframes float5 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(45px, -50px) rotate(30deg); }
        }
        
        @keyframes float6 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-55px, 45px) rotate(-18deg); }
        }
        
        @keyframes float7 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(60px, 55px) rotate(25deg); }
        }
        
        @keyframes float8 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-45px, -60px) rotate(-30deg); }
        }
        
        @keyframes float9 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(50px, -50px) rotate(22deg); }
        }
        
        @keyframes float10 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-60px, 55px) rotate(-25deg); }
        }
        
        @keyframes float11 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(55px, 50px) rotate(18deg); }
        }
        
        @keyframes float12 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(50px, -55px) rotate(-22deg); }
        }
        
        @keyframes float13 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-55px, -50px) rotate(25deg); }
        }
        
        @keyframes float14 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(60px, -45px) rotate(-18deg); }
        }
        
        @keyframes float15 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-50px, 60px) rotate(30deg); }
        }
        
        @keyframes float16 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(55px, 55px) rotate(-25deg); }
        }
        
        @keyframes float17 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-60px, -55px) rotate(22deg); }
        }
        
        @keyframes float18 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(50px, 50px) rotate(-30deg); }
        }
        
        .login-container > .container {
            position: relative;
            z-index: 1;
        }
        
        .login-card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            max-width: 950px;
            width: 100%;
        }
        
        .login-left {
            background: white;
            padding: 4rem 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #2d3748;
            min-height: 650px;
        }
        
        .login-logo {
            width: 100%;
            max-width: 260px;
            height: auto;
            margin-bottom: 3rem;
            filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.08));
        }
        
        .login-right {
            background: linear-gradient(135deg, #2874d4 0%, #1e5bb8 100%);
            padding: 4rem 3.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .login-title {
            font-size: 2rem;
            font-weight: 700;
            color: white;
            margin-bottom: 0.5rem;
        }
        
        .login-subtitle {
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 1.8rem;
            font-size: 0.85rem;
        }
        
        .form-label {
            font-weight: 600;
            color: white;
            margin-bottom: 0.4rem;
            font-size: 0.8rem;
        }
        
        .form-label i {
            color: rgba(255, 255, 255, 0.9);
        }
        
        .form-control,
        .form-select {
            padding: 0.75rem 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 0.5rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.95);
        }
        
        .form-control:focus,
        .form-select:focus {
            border-color: white;
            box-shadow: 0 0 0 0.15rem rgba(255, 255, 255, 0.4);
            background: white;
        }
        
        .btn-login {
            background: white;
            color: #2874d4;
            border: none;
            padding: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            transition: all 0.3s ease;
            font-size: 0.85rem;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 18px rgba(255, 255, 255, 0.4);
            background: #f8f9fa;
            color: #1e5bb8;
        }
        
        .login-welcome {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-align: center;
            color: #2874d4;
            line-height: 1.4;
        }
        
        .login-description {
            text-align: center;
            font-size: 0.85rem;
            line-height: 1.6;
            font-weight: 400;
            color: #4a5568;
        }
        
        .form-check-label {
            font-size: 0.8rem;
            color: white;
        }
        
        .form-check-input {
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        .form-check-input:checked {
            background-color: white;
            border-color: white;
        }
        
        small.text-muted {
            color: rgba(255, 255, 255, 0.8) !important;
            font-size: 0.75rem;
        }
        
        small.text-muted i {
            color: rgba(255, 255, 255, 0.8) !important;
        }
        
        @media (max-width: 768px) {
            .login-left {
                display: none;
            }
            
            .login-right {
                padding: 2.5rem 2rem;
            }
            
            .login-title {
                font-size: 1.75rem;
            }
        }
        
        @media (max-width: 576px) {
            .login-right {
                padding: 2rem 1.5rem;
            }
            
            .login-container {
                padding: 1rem 0.5rem;
            }
        }

        /* Formulario sobre el panel azul */
        .login-right .form-label { color: #fff; }
        .login-right .seg {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem;
            background: rgba(255, 255, 255, 0.15); padding: 0.35rem; border-radius: 10px;
            margin-bottom: 0.4rem;
        }
        .login-right .seg-wrap { position: relative; }
        .login-right .seg input[type="radio"] { position: absolute; opacity: 0; pointer-events: none; }
        .login-right .seg label {
            display: flex; flex-direction: column; align-items: center; gap: 0.2rem;
            padding: 0.55rem 0.25rem; border-radius: 8px; font-size: 0.75rem; font-weight: 600;
            color: rgba(255, 255, 255, 0.9); cursor: pointer; border: 2px solid transparent;
            transition: all 0.2s ease; margin: 0;
        }
        .login-right .seg label i { font-size: 1.1rem; }
        .login-right .seg input[type="radio"]:checked + label {
            background: #fff; color: #1e5bb8; border-color: #fff;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.2);
        }
        .login-right .pass-group { position: relative; }
        .login-right .pass-group .form-control { padding-right: 2.6rem; }
        .login-right .pass-eye {
            position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: #64748b; padding: 0.25rem; line-height: 1;
        }
        .login-right .auth-row {
            display: flex; justify-content: space-between; align-items: center; gap: 0.75rem;
            margin-bottom: 1.25rem; font-size: 0.8rem; color: #fff;
        }
        .login-right .auth-row a { color: #fff; font-weight: 600; text-decoration: underline; }
        .login-right .auth-row .form-check-label { color: #fff; }
        .login-right .btn-login {
            background: #fff !important; color: #1e5bb8 !important; border: none;
            height: 52px; font-weight: 700; font-size: 1rem; border-radius: 8px;
        }
        .login-right .btn-login:hover { background: #eef4ff !important; }
    
        /* Colores invertidos: panel del logo azul, formulario blanco */
        .login-left {
            background: linear-gradient(135deg, #2874d4 0%, #1e5bb8 100%);
            color: #fff;
        }
        .login-left .login-logo {
            background: #fff;
            border-radius: 14px;
            padding: 0.75rem;
            max-width: 260px;
        }
        .login-left .login-welcome { color: #fff; }
        .login-right { background: #fff; }
        .login-title { color: #0f172a; }
        .login-right .form-label { color: #334155; }
        .login-right .form-label i { color: #2874d4; }
        .login-right .form-control,
        .login-right .form-select {
            background: #fff;
            color: #0f172a;
            border: 1px solid #cbd5e1;
        }
        .login-right .form-control:focus,
        .login-right .form-select:focus {
            background: #fff;
            border-color: #2874d4;
            box-shadow: 0 0 0 0.15rem rgba(40, 116, 212, 0.2);
        }
        .login-right .seg { background: #f1f5f9; }
        .login-right .seg label { color: #64748b; }
        .login-right .seg input[type="radio"]:checked + label {
            background: #fff;
            color: #2874d4;
            border-color: #2874d4;
        }
        .login-right .pass-eye { color: #64748b; }
        .login-right .auth-row { color: #475569; }
        .login-right .auth-row a { color: #2874d4; }
        .login-right .auth-row .form-check-label { color: #475569; }
        .login-right .btn-login {
            background: #2874d4 !important;
            color: #fff !important;
        }
        .login-right .btn-login:hover { background: #1e5bb8 !important; }
        .login-right small.text-muted,
        .login-right small.text-muted i { color: #64748b !important; }
    </style>

    <div class="login-container">
        <div class="floating-logo"></div>
        <div class="floating-logo"></div>
        <div class="floating-logo"></div>
        <div class="floating-logo"></div>
        <div class="floating-logo"></div>
        <div class="floating-logo"></div>
        <div class="floating-logo"></div>
        <div class="floating-logo"></div>
        <div class="floating-logo"></div>
        <div class="floating-logo"></div>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-11 col-xl-10">
                    <div class="login-card">
                        <div class="row g-0">
                            <!-- Lado izquierdo con logo -->
                            <div class="col-md-6 login-left">
                                <img src="https://res.cloudinary.com/dwdnfpr8i/image/upload/v1764174072/opticas_dr_mejia-removebg-preview_hwf35n.png" 
                                     alt="Ópticas Dr. Mejía" 
                                     class="login-logo">
                                <div class="login-welcome">
                                    Sistema de Gestión de Órdenes<br>de Trabajo
                                </div>
                            </div>
                            
                            <!-- Lado derecho con formulario -->
                            <div class="col-md-6 login-right">
                                <h2 class="login-title">Iniciar Sesión</h2>
                                
                                <form action="" method="post">
                                    {{ form.csrf_token if form else '' }}

                                    <div class="mb-3">
                                        <span class="form-label d-block">Tipo de usuario</span>
                                        <div class="seg" role="radiogroup">
                                            <div class="seg-wrap">
                                                <input type="radio" name="user_type" id="type_central" value="central">
                                                <label for="type_central"><i class="bi bi-shield-check"></i>Administración</label>
                                            </div>
                                            <div class="seg-wrap">
                                                <input type="radio" name="user_type" id="type_sede" value="sede">
                                                <label for="type_sede"><i class="bi bi-building"></i>Sede</label>
                                            </div>
                                            <div class="seg-wrap">
                                                <input type="radio" name="user_type" id="type_proveedor" value="proveedor">
                                                <label for="type_proveedor"><i class="bi bi-truck"></i>Proveedor</label>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="mb-3 d-none" id="sede_selection">
                                        <label for="sede_id" class="form-label">Seleccionar Sede</label>
                                        <select name="sede_id" id="sede_id" class="form-select">
                                            <option value="0">Selecciona tu sede</option>
                                            {% for sede in sedes %}
                                                <option value="{{ sede.id }}">{{ sede.name }} - {{ sede.city }}</option>
                                            {% endfor %}
                                        </select>
                                    </div>

                                    <div class="mb-3 d-none" id="username_field">
                                        <label for="username" class="form-label">Usuario</label>
                                        <input type="text" name="username" id="username" class="form-control" placeholder="Ingresa tu usuario" autocomplete="username">
                                    </div>

                                    <div class="mb-3">
                                        <label for="password" class="form-label">Contraseña</label>
                                        <div class="pass-group">
                                            <input type="password" name="password" id="password" class="form-control" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
                                            <button type="button" class="pass-eye" id="togglePassword" aria-label="Mostrar contraseña">
                                                <i class="bi bi-eye"></i>
                                            </button>
                                        </div>
                                    </div>

                                    <div class="auth-row">
                                        <label for="remember_me" class="form-check-label">
                                            <input type="checkbox" name="remember_me" id="remember_me" class="me-1">
                                            Recordar en este equipo
                                        </label>
                                        <a href="#">¿Olvidaste tu contraseña?</a>
                                    </div>

                                    <button type="submit" class="btn btn-login w-100">Ingresar <i class="bi bi-arrow-right"></i></button>
                                </form>
                                
                                <div class="text-center mt-4">
                                    <small class="text-muted">
                                        <i class="fas fa-info-circle me-1"></i>
                                        ¿No tienes cuenta? Contacta al administrador.
                                    </small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const userTypeRadios = document.querySelectorAll('input[name="user_type"]');
            const sedeSelection = document.getElementById('sede_selection');
            const usernameField = document.getElementById('username_field');
            const usernameInput = document.getElementById('username');
            const sedeSelect = document.getElementById('sede_id');
            const passwordField = document.getElementById('password');
            const togglePassword = document.getElementById('togglePassword');
            const form = document.querySelector('form');

            function selectedType() {
                const checked = document.querySelector('input[name="user_type"]:checked');
                return checked ? checked.value : '';
            }

            function toggleFields() {
                const type = selectedType();
                if (type === 'sede') {
                    sedeSelection.classList.remove('d-none');
                    usernameField.classList.add('d-none');
                    usernameInput.value = '';
                    passwordField.placeholder = 'Contraseña de la sede';
                } else if (type === 'central' || type === 'proveedor') {
                    sedeSelection.classList.add('d-none');
                    sedeSelect.value = '0';
                    usernameField.classList.remove('d-none');
                    usernameInput.placeholder = type === 'central' ? 'Usuario administrador' : 'Usuario proveedor';
                    passwordField.placeholder = type === 'central' ? 'Contraseña de administrador' : 'Contraseña de proveedor';
                } else {
                    sedeSelection.classList.add('d-none');
                    usernameField.classList.add('d-none');
                    passwordField.placeholder = 'Ingresa tu contraseña';
                }
            }

            userTypeRadios.forEach(r => r.addEventListener('change', toggleFields));

            togglePassword.addEventListener('click', function() {
                const showing = passwordField.type === 'text';
                passwordField.type = showing ? 'password' : 'text';
                this.querySelector('i').className = showing ? 'bi bi-eye' : 'bi bi-eye-slash';
            });

            form.addEventListener('submit', function(e) {
                const type = selectedType();
                if (!type) {
                    e.preventDefault();
                    alert('Selecciona el tipo de usuario');
                    return;
                }
                if (type === 'sede' && (!sedeSelect.value || sedeSelect.value === '0')) {
                    e.preventDefault();
                    alert('Por favor selecciona una sede válida de la lista');
                    sedeSelect.focus();
                    return;
                }
                if ((type === 'central' || type === 'proveedor') && !usernameInput.value.trim()) {
                    e.preventDefault();
                    alert('Por favor ingresa tu nombre de usuario');
                    usernameInput.focus();
                    return;
                }
                if (!passwordField.value.trim()) {
                    e.preventDefault();
                    alert('Por favor ingresa tu contraseña');
                    passwordField.focus();
                }
            });

            toggleFields();
        });
    </script>
{% endblock %}
