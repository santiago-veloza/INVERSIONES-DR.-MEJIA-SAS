{% extends "base_auth.html" %}
{% block content %}
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        
        .login-card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            max-width: 950px;
            width: 100%;
        }
        
        .login-left {
            background: white;
            padding: 4rem 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #2d3748;
            min-height: 650px;
        }
        
        .login-logo {
            width: 100%;
            max-width: 260px;
            height: auto;
            margin-bottom: 3rem;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.1));
        }
        
        .login-right {
            background: linear-gradient(135deg, #2874d4 0%, #1e5bb8 100%);
            padding: 4rem 3.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .login-title {
            font-size: 2rem;
            font-weight: 700;
            color: white;
            margin-bottom: 0.5rem;
        }
        
        .login-subtitle {
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 2.5rem;
            font-size: 0.95rem;
        }
        
        .form-label {
            font-weight: 600;
            color: white;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        
        .form-label i {
            color: rgba(255, 255, 255, 0.9);
        }
        
        .form-control,
        .form-select {
            padding: 0.75rem 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 0.5rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.95);
        }
        
        .form-control:focus,
        .form-select:focus {
            border-color: white;
            box-shadow: 0 0 0 0.2rem rgba(255, 255, 255, 0.4);
            background: white;
        }
        
        .btn-login {
            background: white;
            color: #2874d4;
            border: none;
            padding: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.4);
            background: #f8f9fa;
            color: #1e5bb8;
        }
        
        .login-welcome {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-align: center;
            color: #2874d4;
            line-height: 1.5;
        }
        
        .login-description {
            text-align: center;
            font-size: 1rem;
            line-height: 1.7;
            font-weight: 400;
            color: #4a5568;
        }
        
        .form-check-label {
            font-size: 0.9rem;
            color: white;
        }
        
        .form-check-input {
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        .form-check-input:checked {
            background-color: white;
            border-color: white;
        }
        
        small.text-muted {
            color: rgba(255, 255, 255, 0.8) !important;
        }
        
        small.text-muted i {
            color: rgba(255, 255, 255, 0.8) !important;
        }
        
        @media (max-width: 768px) {
            .login-left {
                display: none;
            }
            
            .login-right {
                padding: 2.5rem 2rem;
            }
            
            .login-title {
                font-size: 1.75rem;
            }
        }
        
        @media (max-width: 576px) {
            .login-right {
                padding: 2rem 1.5rem;
            }
            
            .login-container {
                padding: 1rem 0.5rem;
            }
        }
    </style>

    <div class="login-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-11 col-xl-10">
                    <div class="login-card">
                        <div class="row g-0">
                            <!-- Lado izquierdo con logo -->
                            <div class="col-md-6 login-left">
                                <img src="https://res.cloudinary.com/dwdnfpr8i/image/upload/v1764174072/opticas_dr_mejia-removebg-preview_hwf35n.png" 
                                     alt="Ópticas Dr. Mejía" 
                                     class="login-logo">
                                <div class="login-welcome">
                                    Sistema de Gestión de Órdenes<br>de Trabajo
                                </div>
                            </div>
                            
                            <!-- Lado derecho con formulario -->
                            <div class="col-md-6 login-right">
                                <h2 class="login-title">Iniciar Sesión</h2>
                                
                                <form action="" method="post">
                                    <div class="mb-3">
                                        <label for="user_type" class="form-label">
                                            <i class="fas fa-user-tag me-2"></i>Tipo de Usuario
                                        </label>
                                        <select name="user_type" id="user_type" class="form-select" required>
                                            <option value="">Seleccionar tipo de usuario</option>
                                            <option value="sede">Sede</option>
                                            <option value="central">Administración Central</option>
                                            <option value="proveedor">Proveedor</option>
                                        </select>
                                    </div>
                                    
                                    <div class="mb-3" id="sede_selection" style="display: none;">
                                        <label for="sede_id" class="form-label">
                                            <i class="fas fa-building me-2"></i>Sede
                                        </label>
                                        <select name="sede_id" id="sede_id" class="form-select">
                                            <option value="0">Seleccionar Sede</option>
                                            {% for sede in sedes %}
                                            <option value="{{ sede.id }}">{{ sede.name }} - {{ sede.city }}</option>
                                            {% endfor %}
                                        </select>
                                        <small class="text-muted">Selecciona la sede desde la cual vas a trabajar</small>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="username" class="form-label">
                                            <i class="fas fa-user me-2"></i>Usuario
                                        </label>
                                        <input type="text" 
                                               name="username" 
                                               id="username" 
                                               class="form-control" 
                                               placeholder="Ingresa tu usuario"
                                               required>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="password" class="form-label">
                                            <i class="fas fa-lock me-2"></i>Contraseña
                                        </label>
                                        <input type="password" 
                                               name="password" 
                                               id="password" 
                                               class="form-control" 
                                               placeholder="Ingresa tu contraseña"
                                               required>
                                    </div>
                                    
                                    <div class="mb-4 form-check">
                                        <input type="checkbox" 
                                               name="remember_me" 
                                               id="remember_me" 
                                               class="form-check-input">
                                        <label for="remember_me" class="form-check-label">
                                            Recordarme en este dispositivo
                                        </label>
                                    </div>
                                    
                                    <button type="submit" class="btn btn-primary btn-login w-100">
                                        <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
                                    </button>
                                </form>
                                
                                <div class="text-center mt-4">
                                    <small class="text-muted">
                                        <i class="fas fa-info-circle me-1"></i>
                                        ¿No tienes cuenta? Contacta al administrador.
                                    </small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const userTypeSelect = document.getElementById('user_type');
            const sedeSelection = document.getElementById('sede_selection');
            
            function toggleSedeSelection() {
                if (userTypeSelect.value === 'sede') {
                    sedeSelection.style.display = 'block';
                    sedeSelection.querySelector('select').required = true;
                } else {
                    sedeSelection.style.display = 'none';
                    sedeSelection.querySelector('select').required = false;
                    sedeSelection.querySelector('select').value = '';
                }
            }
            
            userTypeSelect.addEventListener('change', toggleSedeSelection);
            toggleSedeSelection(); 
        });
    </script>
{% endblock %}
